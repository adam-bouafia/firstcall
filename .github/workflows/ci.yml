name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q

  web:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build

  chart:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/firstcall
      - run: >
          helm template t charts/firstcall
          --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true
          --set dashboard.enabled=true > /dev/null
      - name: dashboard JSON is valid
        run: python3 -m json.tool charts/firstcall/dashboards/firstcall.json > /dev/null

  e2e:
    name: e2e on kind (chart + images + real failures)
    needs: [test, web, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # real model when the secret exists, canned answers otherwise: the lifecycle is tested either way
      LLM: ${{ secrets.NEBIUS_API_KEY != '' && 'real' || 'mock' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: firstcall, config: infra/kind-config.yaml}
      - name: build images and load them into kind
        run: |
          docker build -t firstcall-backend:ci -f backend/Dockerfile .
          docker build -t firstcall-frontend:ci frontend
          docker pull -q busybox:1.36
          kind load docker-image firstcall-backend:ci firstcall-frontend:ci busybox:1.36 --name firstcall
      - name: break the cluster (every scenario)
        run: ./scripts/break.sh all
      - name: helm install FirstCall
        run: |
          helm upgrade --install firstcall charts/firstcall -n firstcall-system --create-namespace \
            --set image.api.repository=firstcall-backend --set image.api.tag=ci --set image.api.pullPolicy=Never \
            --set image.web.repository=firstcall-frontend --set image.web.tag=ci --set image.web.pullPolicy=Never \
            --set model.llm=$LLM --set model.default=qwen3-30b --set remediation.enabled=true \
            --set watch.namespaces=firstcall-demo --set web.service.type=NodePort \
            --set secrets.NEBIUS_API_KEY="${{ secrets.NEBIUS_API_KEY }}" \
            --wait --timeout 5m
      - name: e2e (detect -> diagnose -> events -> alert -> fix -> resolve)
        run: |
          kubectl -n firstcall-system port-forward svc/firstcall-api 8000:8000 &
          sleep 5
          API_URL=http://localhost:8000 TIMEOUT=600 ./scripts/e2e.sh
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n firstcall-system logs deploy/firstcall-api --tail=200
          kubectl -n firstcall-demo get events --sort-by=.lastTimestamp | tail -40

  images:
    name: publish images
    if: github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: firstcall-backend, context: ., file: backend/Dockerfile}
          - {name: firstcall-frontend, context: frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: lowercase owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart-release:
    name: publish Helm chart (OCI)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $VERSION/; s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/firstcall/Chart.yaml
          sed -i "s|ghcr.io/adam-bouafia/|ghcr.io/$OWNER/|" charts/firstcall/values.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/firstcall
          helm push firstcall-$VERSION.tgz oci://ghcr.io/$OWNER/charts
          echo "Install: helm install firstcall oci://ghcr.io/$OWNER/charts/firstcall --version $VERSION" >> $GITHUB_STEP_SUMMARY
