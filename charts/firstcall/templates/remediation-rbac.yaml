{{- if .Values.remediation.enabled }}
# Narrow write access, used ONLY after a human approves a specific fix that passed a server dry run.
# Scoped per namespace with RoleBindings; nothing cluster-wide, no delete, no secrets, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "firstcall.fullname" . }}-remediate
  labels: {{- include "firstcall.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, patch]
{{- range $ns := splitList "," .Values.watch.namespaces }}
{{- $ns = trim $ns }}
{{- if and $ns (ne $ns "*") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "firstcall.fullname" $ }}-remediate
  namespace: {{ $ns }}
  labels: {{- include "firstcall.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "firstcall.fullname" $ }}-remediate
subjects:
  - kind: ServiceAccount
    name: {{ include "firstcall.serviceAccount" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
