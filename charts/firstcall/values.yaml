# ---------------------------------------------------------------- images
image:
  api:
    repository: ghcr.io/adam-bouafia/firstcall-backend
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/adam-bouafia/firstcall-frontend
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

# ---------------------------------------------------------------- model
model:
  llm: real                 # real | mock
  default: qwen3-30b        # key from models.yaml, "cascade", or provider:model-id

# Provider keys. Prefer an existing Secret in production:
#   kubectl -n firstcall-system create secret generic firstcall-keys --from-literal=NEBIUS_API_KEY=...
existingSecret: ""
secrets:
  NEBIUS_API_KEY: ""
  GROQ_API_KEY: ""
  CEREBRAS_API_KEY: ""
  OPENROUTER_API_KEY: ""
  SLACK_WEBHOOK_URL: ""
  TELEGRAM_BOT_TOKEN: ""
  TAVILY_API_KEY: ""
  ELEVENLABS_API_KEY: ""
ollamaBaseUrl: ""           # e.g. http://<host-ip>:11434/v1/

# ---------------------------------------------------------------- behaviour
watch:
  namespaces: "*"              # comma list, or "*" = every namespace except kube-*, this release's and `exclude`
  exclude: ""                  # with "*": more namespaces to skip, comma list (e.g. "monitoring,cert-manager")
  interval: 15
  autoDiagnose: true
  autoInvestigate: 1           # read-only follow-up commands per new incident (0 = off)
  resolveAfter: 2
writeEvents: true              # post diagnoses as Kubernetes Events on the broken workload

# ---------------------------------------------------------------- human-approved fixes
remediation:
  enabled: false               # true: a person can dry-run + approve a proposed fix (console / Telegram)
  # RoleBindings are created in each namespace of watch.namespaces (they must exist before install),
  # so remediation needs an explicit list, not "*". Only enable it behind an authenticated console (SECURITY.md).
  # Verbs granted: patch/update Deployments (+scale), list ReplicaSets (rollout undo), patch Services.

# ---------------------------------------------------------------- paging (Telegram / Slack)
alerting:
  mode: always                 # always (24/7) | offhours (weekdays 17:00-09:00 + weekends); changeable at runtime
  timezone: Europe/Amsterdam
  businessStart: "09:00"
  businessEnd: "17:00"
  businessDays: mon-fri
webSearch: low-confidence      # off | low-confidence | always (needs secrets.TAVILY_API_KEY)
voiceAlerts: false             # Telegram voice note (needs secrets.ELEVENLABS_API_KEY)
telegram:
  chatIds: ""                  # comma separated; send /start to the bot to get yours
  commands: true               # /status /incidents /mode + inline buttons (one poller per bot token!)
publicUrl: ""                  # link used in Slack messages
extraEnv: {}

# ---------------------------------------------------------------- security
rbac:
  create: true
serviceAccount:
  create: true
  name: ""
# Pod security contexts. OpenShift assigns its own UIDs: set both runAsUser fields to null there.
podSecurityContext:
  api: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
  web: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}

# ---------------------------------------------------------------- scheduling (both pods)
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------- storage
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""             # "" = cluster default (local-path on k3s)

# ---------------------------------------------------------------- services
api:
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
web:
  enabled: true
  service:
    type: ClusterIP            # NodePort for a lab cluster (make install sets it), or use the Ingress below
    port: 3000
    nodePort: 30300            # only used with type NodePort
  # The console has no login: put authentication in front of it (oauth2-proxy, ingress auth). See SECURITY.md.
  ingress:
    enabled: false
    className: ""              # e.g. nginx, traefik
    annotations: {}
    host: firstcall.example.com
    tls: []                    # [{secretName: firstcall-tls, hosts: [firstcall.example.com]}]
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 256Mi}

# ---------------------------------------------------------------- monitoring (Prometheus Operator CRDs)
metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Fast alerts on the demo namespace so Alertmanager -> FirstCall fires in ~1 min
    # (kube-prometheus-stack's KubePodCrashLooping waits 15 min).
    fastPodAlerts: true
dashboard:
  enabled: false               # Grafana sidecar picks up ConfigMaps labelled grafana_dashboard=1
  labels:
    grafana_dashboard: "1"
