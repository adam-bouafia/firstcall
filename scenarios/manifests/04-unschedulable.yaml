# Root cause: requests 64 CPUs; no node can fit it -> Pending / FailedScheduling.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ml-batch, namespace: firstcall-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: ml-batch}}
  template:
    metadata: {labels: {app: ml-batch}}
    spec:
      containers:
      - name: trainer
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources: {requests: {cpu: "64", memory: 64Mi}}
