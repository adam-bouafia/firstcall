# Root cause: PVC asks for StorageClass fast-ssd which does not exist -> PVC Pending -> pod Pending.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ledger-data, namespace: firstcall-demo}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-db, namespace: firstcall-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger-db}}
  template:
    metadata: {labels: {app: ledger-db}}
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ledger-data}
