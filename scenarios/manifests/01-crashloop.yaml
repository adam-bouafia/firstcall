# Root cause: app requires DATABASE_URL, which is not set -> exits 1 -> CrashLoopBackOff.
# It also prints a (fake) API key, to prove FirstCall redacts logs before any model sees them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy payments-api v2.3.1: DB config moved to Vault"}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata: {labels: {app: payments-api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "$(date -Iseconds) INFO  payments-api v2.3.1 starting"
          echo "$(date -Iseconds) INFO  loaded config STRIPE_API_KEY=sk_live_51HxFAKEFAKEFAKE0000 region=eu-west"
          echo "$(date -Iseconds) INFO  connecting to database"
          if [ -z "$DATABASE_URL" ]; then
            echo "$(date -Iseconds) FATAL config: required environment variable DATABASE_URL is not set"
            exit 1
          fi
          sleep 3600
        env:
        - {name: LOG_LEVEL, value: info}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
