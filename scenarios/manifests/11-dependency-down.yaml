# Root cause is NOT the crashing workload: inventory-db was scaled to 0 "for maintenance" and never
# scaled back. cart-api crash-loops because it cannot reach it; its own spec and rollout history are
# unchanged. Service inventory-db has no endpoints. Fix: scale inventory-db back to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy inventory-db v12.4"}
spec:
  replicas: 0
  selector: {matchLabels: {app: inventory-db}}
  template:
    metadata: {labels: {app: inventory-db}}
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 5432 -h /www"]
        ports: [{containerPort: 5432}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
