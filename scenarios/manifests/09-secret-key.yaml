# Root cause: v4.2.0 "standardises key names" and reads key `password`, but Secret auth-db only has
# `db_password`. The Secret exists, so this is not a missing object: the pod never starts
# (CreateContainerConfigError: couldn't find key password in Secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy auth-svc v4.2.0"}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-svc}}
  template:
    metadata: {labels: {app: auth-svc}}
    spec:
      containers:
      - name: svc
        image: busybox:1.36
        command: ["sh", "-c", "echo auth-svc v4.2.0 ready; sleep 3600"]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: auth-db, key: password}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
