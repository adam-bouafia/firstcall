# Healthy v4.1.0: DB_PASSWORD comes from key db_password of Secret auth-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy auth-svc v4.1.0"}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-svc}}
  template:
    metadata: {labels: {app: auth-svc}}
    spec:
      containers:
      - name: svc
        image: busybox:1.36
        command: ["sh", "-c", "echo auth-svc v4.1.0 ready; sleep 3600"]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: auth-db, key: db_password}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Secret
metadata: {name: auth-db, namespace: firstcall-demo}
stringData: {db_password: not-a-real-password}
