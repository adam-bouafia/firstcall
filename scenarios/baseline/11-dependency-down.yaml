# Healthy: inventory-db (1 replica) behind Service inventory-db, and cart-api which checks it every 5 s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy inventory-db v12.4"}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-db}}
  template:
    metadata: {labels: {app: inventory-db}}
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 5432 -h /www"]
        ports: [{containerPort: 5432}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory-db, namespace: firstcall-demo}
spec:
  selector: {app: inventory-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy cart-api v3.0.2"}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart-api}}
  template:
    metadata: {labels: {app: cart-api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "$(date -Iseconds) INFO  cart-api v3.0.2 starting"
          fails=0
          while true; do
            if wget -q -T 2 -O /dev/null http://inventory-db:5432/ 2>/tmp/err; then
              [ $fails -gt 0 ] && echo "$(date -Iseconds) INFO  inventory-db reachable again"
              fails=0
            else
              fails=$((fails+1))
              echo "$(date -Iseconds) ERROR inventory-db:5432 unreachable ($fails/3): $(cat /tmp/err)"
              [ $fails -ge 3 ] && { echo "$(date -Iseconds) FATAL cannot reach inventory-db, exiting"; exit 1; }
            fi
            sleep 5
          done
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
