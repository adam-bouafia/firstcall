# Healthy: busybox:1.36. The broken manifest bumps the tag and swaps the digits (1.63).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-web
  namespace: firstcall-demo
  annotations: {kubernetes.io/change-cause: "deploy checkout-web with busybox 1.36"}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout-web}}
  template:
    metadata: {labels: {app: checkout-web}}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo checkout > /www/index.html && httpd -f -p 80 -h /www"]
        ports: [{containerPort: 80}]
